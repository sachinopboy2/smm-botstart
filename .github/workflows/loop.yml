name: Smart BotStart Loop
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/2 * * * *'
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Fire
      run: |
        pip install requests -q
        python3 -c "
import requests,time,warnings
warnings.filterwarnings('ignore')
T='https://t.me/@@Opanokebot'
U='https://core.smm.plus/api/free-service/order'
H={'Content-Type':'application/json','Origin':'https://smm.plus','Referer':'https://smm.plus/free-telegram-botstart'}
ok=0
for i in range(3):
    r=requests.post(U,json={'service':'telegram_bot_start','link':T,'quantity':100},headers=H,verify=False,timeout=15)
    try:
        d=r.json()
        if d.get('ok'):
            ok+=1
            print(f'OK {ok*100} | {T}')
        else:
            rt=d.get('retry_after_seconds',120)
            print(f'Wait {rt}s | {d.get(\"error\",\"\")[:30]} | {T}')
            time.sleep(min(rt,120))
    except:
        print(f'ERR: {r.status_code} {r.text[:50]}')
    time.sleep(3)
print(f'Done: {ok*100} botstart for {T}')
"
