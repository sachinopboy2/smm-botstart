name: BotStart
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
    - uses: actions/checkout@v3
    - name: Order
      run: |
        pip install requests -q
        python run.py "https://t.me/@@Opanokebot"
